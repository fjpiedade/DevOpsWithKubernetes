apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-app
  namespace: project
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo-app
  template:
    metadata:
      labels:
        app: todo-app
    spec:
      containers:
        - name: todo-app
          image: fjpiedade/todo-app:2.6
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 9901
          envFrom:
            - configMapRef:
                name: todo-app-config
          volumeMounts:
            - name: todo-app-storage
              mountPath: /data
      volumes:
        - name: todo-app-storage
          persistentVolumeClaim:
            claimName: persisting-data-pvc
