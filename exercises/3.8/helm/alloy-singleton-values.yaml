alloy:
  configMap:
    create: false
  mounts:
    dockercontainers: true
    varlog: true
  resources: {}
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      add:
        - NET_BIND_SERVICE
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault

controller:
  nodeSelector:
    kubernetes.io/os: linux
  podAnnotations:
    k8s.grafana.com/logs.job: integrations/alloy

crds:
  create: false

nameOverride: alloy-singleton
