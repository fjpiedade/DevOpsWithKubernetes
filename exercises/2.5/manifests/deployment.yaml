apiVersion: apps/v1
kind: Deployment
metadata:
  name: ping-pong
  namespace: exercises
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ping-pong
  template:
    metadata:
      labels:
        app: ping-pong
    spec:
      containers:
        - name: ping-pong
          image: fjpiedade/ping-pong:2.1
          imagePullPolicy: Always
          ports:
            - containerPort: 9901
          env:
            - name: PORT
              value: "9901"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-output
  namespace: exercises
spec:
  replicas: 1
  selector:
    matchLabels:
      app: log-output
  template:
    metadata:
      labels:
        app: log-output
    spec:
      containers:
        - name: log-writer
          image: fjpiedade/log-writer:2.1
          imagePullPolicy: Always
          env:
            - name: LOG_FILE
              value: /usr/src/app/files/log.txt
          volumeMounts:
            - name: log-data
              mountPath: /usr/src/app/files

        - name: log-reader
          image: fjpiedade/log-reader:2.5
          imagePullPolicy: Always
          ports:
            - containerPort: 9901
          env:
            - name: PORT
              value: "9901"
            - name: LOG_FILE
              value: /usr/src/app/files/log.txt
            - name: PINGPONG_URL
              value: "http://ping-pong-svc:80/pings"
            - name: CONFIG_FILE
              value: /usr/src/app/config/information.txt
            - name: MESSAGE
              valueFrom:
                configMapKeyRef:
                  name: log-output-config
                  key: MESSAGE
          volumeMounts:
            - name: log-data
              mountPath: /usr/src/app/files
            - name: config-volume
              mountPath: /usr/src/app/config
              readOnly: true

      volumes:
        - name: log-data
          emptyDir: {}
        - name: config-volume
          configMap:
            name: log-output-config
            items:
              - key: information.txt
                path: information.txt
